<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1218">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VIBE">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta property="og:title" content="VIBE: The Republic">
<meta property="og:description" content="A multiplayer 3D life sim set in Port Veyra. Work, eat, rent, run a buka, vote and run for mayor.">
<meta property="og:image" content="https://sifonaniefiok.github.io/vibe/icons/icon-512.png">
</head>
<body>
<title>VIBE: The Republic</title>
<meta name="description" content="A multiplayer 3D life sim set in Port Veyra. Work, eat, rent, run a buka, vote and run for mayor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bowlby+One+SC&display=swap">
<style>
/* Layout: full-bleed 3D city; HUD pinned to the safe-area corners; the phone slides over from the right. */
:root {
  --ink: #0f1218;
  --panel: #161b23;
  --panel-2: #1f2631;
  --line: #2d3644;
  --text: #f3efe4;
  --muted: #9ea7b4;
  --danfo: #f5c518;
  --danfo-ink: #1a1400;
  --leaf: #22a06b;
  --coral: #ff6b4a;
  --sky: #5cc8e0;
  --display: 'Bowlby One SC', 'Arial Black', Impact, sans-serif;
  --body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text); font-family: var(--body); font-size: 15px; overflow: hidden; }
body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
input, textarea { -webkit-user-select: text; user-select: text; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--danfo); outline-offset: 2px; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* ── HUD ── */
.hud { position: fixed; inset: 0; pointer-events: none; padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px); }
.hud > * { pointer-events: auto; }
.hud-top { pointer-events: none !important; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.hud-top > * { pointer-events: auto; }
.chip { background: rgba(15, 18, 24, .82); border: 1px solid var(--line); border-radius: 12px; padding: 7px 11px; display: flex; flex-direction: column; gap: 4px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.money { font-family: var(--display); font-size: 19px; letter-spacing: .02em; color: var(--danfo); font-variant-numeric: tabular-nums; line-height: 1; }
.meter { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.bar { width: 92px; height: 6px; border-radius: 3px; background: #2a313c; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--leaf); border-radius: 3px; transition: width .4s; }
.bar.low > i { background: var(--coral); }
.clock { text-align: right; font-variant-numeric: tabular-nums; }
.clock b { font-family: var(--display); font-size: 17px; font-weight: 400; display: block; line-height: 1; }
.clock span { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--leaf); margin-right: 4px; vertical-align: 1px; }
.dot.off { background: var(--coral); }

.tracker { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 66px); width: min(360px, calc(100% - 24px)); background: rgba(15, 18, 24, .9); border: 1px solid var(--line); border-left: 4px solid var(--danfo); border-radius: 12px; padding: 9px 12px; pointer-events: auto; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.tracker .t-job { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--danfo); }
.tracker .t-goal { font-weight: 700; font-size: 15px; grid-column: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tracker .t-meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.tracker .t-time { grid-row: 1 / span 3; grid-column: 2; align-self: center; font-family: var(--display); font-size: 18px; font-variant-numeric: tabular-nums; }
.tracker button { grid-column: 1 / -1; justify-self: start; margin-top: 4px; background: none; border: 0; padding: 2px 0; color: var(--muted); font-size: 12px; text-decoration: underline; }

.ticker { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); width: min(460px, calc(100% - 260px)); min-width: 0; background: rgba(15, 18, 24, .82); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 13px; display: flex; gap: 8px; align-items: center; overflow: hidden; pointer-events: auto; }
.ticker b { font-family: var(--display); font-weight: 400; font-size: 11px; color: var(--danfo-ink); background: var(--danfo); padding: 2px 7px; border-radius: 4px; flex: none; letter-spacing: .04em; }
.ticker span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.controls { position: fixed; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.btn-round { width: 54px; height: 54px; border-radius: 50%; border: 1px solid var(--line); background: rgba(15, 18, 24, .86); display: grid; place-items: center; }
.btn-round svg { width: 24px; height: 24px; }
.btn-round small { display: block; font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: -2px; }
.btn-act { min-width: 54px; max-width: 220px; height: 54px; border-radius: 27px; border: 0; background: var(--danfo); color: var(--danfo-ink); font-weight: 700; font-size: 15px; padding: 0 20px; box-shadow: 0 4px 0 #b38f00; }
.btn-act:active { transform: translateY(2px); box-shadow: 0 2px 0 #b38f00; }
.row-btns { display: flex; gap: 10px; }

.joy { position: fixed; left: 18px; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); width: 128px; height: 128px; border-radius: 50%; background: rgba(15, 18, 24, .45); border: 1px solid rgba(255, 255, 255, .14); touch-action: none; }
.joy i { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(243, 239, 228, .82); }

.toasts { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(420px, calc(100% - 24px)); }
.toast { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; font-size: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, .35); animation: pop .25s ease-out; max-width: 100%; }
.toast.err { border-color: var(--coral); }
.toast.ok { border-color: var(--leaf); }
.toast.money { border-color: var(--danfo); }
@keyframes pop { from { transform: translateY(6px); opacity: 0; } }
html, body { overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
@media (pointer: coarse) { input, textarea, select { font-size: 16px !important; } }
.install-pill { display: inline-flex; align-items: center; gap: 8px; background: var(--danfo); color: var(--danfo-ink); border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; margin-bottom: 14px; }
.install-pill svg { width: 18px; height: 18px; }
.steps { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; line-height: 1.45; }
.steps b { color: var(--text); }

/* ── Sheets (place menus, shift screens) ── */
.sheet-wrap { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; background: rgba(5, 7, 10, .45); z-index: 20; }
.sheet { width: min(480px, 100%); max-height: 88%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 18px 18px calc(env(safe-area-inset-bottom, 0px) + 18px); animation: rise .22s ease-out; touch-action: pan-y; }
@media (min-width: 720px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 20px; } }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
.sheet h2 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0; line-height: 1.1; text-wrap: balance; }
.sheet .kicker { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--danfo); margin-bottom: 4px; }
.sheet p { color: var(--muted); line-height: 1.45; margin: 6px 0 0; }
.sheet-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; margin-bottom: 12px; }
.x { background: var(--panel-2); border: 1px solid var(--line); border-radius: 50%; width: 36px; height: 36px; flex: none; font-size: 18px; line-height: 1; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
.card > div { flex: 1; min-width: 0; }
.card h3 { margin: 0; font-size: 16px; }
.card p { margin: 2px 0 0; font-size: 13px; }
.price { font-family: var(--display); color: var(--danfo); font-size: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.btn { border: 0; border-radius: 11px; padding: 10px 15px; font-weight: 700; background: var(--danfo); color: var(--danfo-ink); white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn.green { background: var(--leaf); color: #04140c; }
.btn.red { background: var(--coral); color: #1d0a04; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.wide { width: 100%; padding: 13px; font-size: 16px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.field input, .field textarea, .field select { background: var(--ink); border: 1px solid var(--line); border-radius: 10px; color: var(--text); padding: 11px 12px; font: inherit; width: 100%; }
.field textarea { resize: none; min-height: 70px; }
.note { font-size: 12px; color: var(--muted); line-height: 1.45; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-variant-numeric: tabular-nums; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-weight: 700; }
.kv .total { border-top: 1px solid var(--line); padding-top: 6px; color: var(--text); font-size: 17px; }
.pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.pill.good { color: var(--leaf); border-color: var(--leaf); }
.pill.bad { color: var(--coral); border-color: var(--coral); }

/* Permit card (clerk job) */
.permit { background: #f4ecd8; color: #23211c; border-radius: 12px; padding: 16px; font-family: var(--body); box-shadow: inset 0 0 0 2px #d9cba8; }
.permit .ph { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #6b6150; }
.permit h3 { font-family: var(--display); font-weight: 400; margin: 6px 0 10px; font-size: 22px; }
.permit dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; }
.permit dt { color: #6b6150; }
.permit dd { margin: 0; font-weight: 700; }
.rules { font-size: 12px; color: var(--muted); background: var(--ink); border-radius: 10px; padding: 10px 12px; line-height: 1.5; }
.rules b { color: var(--text); }

/* ── Phone ── */
.phone { position: fixed; z-index: 15; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 12px); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); width: min(380px, calc(100% - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 26px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); animation: slide .22s ease-out; }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } }
@media (max-width: 520px) { .phone { right: 0; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 0; border: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); } }
.ph-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); gap: 10px; }
.ph-bar h2 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 0; flex: 1; min-width: 0; }
.ph-bar button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 13px; }
.ph-body { flex: 1; overflow: auto; padding: 14px; touch-action: pan-y; min-height: 0; }
.apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 8px; }
.app { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--text); }
.app i { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; }
.app i svg { width: 28px; height: 28px; }
.wallet { background: var(--danfo); color: var(--danfo-ink); border-radius: 18px; padding: 16px; margin-bottom: 18px; }
.wallet small { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }
.wallet b { display: block; font-family: var(--display); font-weight: 400; font-size: 32px; margin: 4px 0; font-variant-numeric: tabular-nums; }
.wallet span { font-size: 12px; }
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.li .a { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.li .b { color: var(--muted); font-size: 12px; min-width: 0; overflow-wrap: anywhere; }
.li .v { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-variant-numeric: tabular-nums; font-weight: 700; }
.li .v.in { color: var(--leaf); }
.news-item { padding: 11px 0; border-bottom: 1px solid var(--line); }
.news-item .k { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.news-item.story .k { color: var(--danfo); }
.news-item .h { font-weight: 700; margin-top: 3px; line-height: 1.35; overflow-wrap: anywhere; }
.chat-log { display: flex; flex-direction: column; gap: 8px; }
.msg { background: var(--panel-2); border-radius: 12px; padding: 7px 11px; max-width: 86%; align-self: flex-start; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: #2a3a2f; }
.msg b { font-size: 12px; color: var(--danfo); display: block; }
.chat-input { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
.chat-input input { flex: 1; min-width: 0; background: var(--ink); border: 1px solid var(--line); border-radius: 10px; color: var(--text); padding: 10px 12px; font: inherit; }
.section-title { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
.cand { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
.cand .votes { font-family: var(--display); font-size: 18px; color: var(--danfo); }
.cand .sl { color: var(--muted); font-size: 13px; grid-column: 1; overflow-wrap: anywhere; }
.cand .bar { width: 100%; grid-column: 1 / -1; height: 5px; }
.mapwrap { position: relative; width: 100%; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: #1a2a22; max-width: 100%; }
.mapwrap canvas { width: 100%; height: 100%; display: block; }
.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px; overflow-wrap: anywhere; -webkit-user-select: all; user-select: all; }
.range-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.range-row input { grid-column: 1 / -1; width: 100%; accent-color: var(--danfo); }

/* ── Onboarding / creator ── */
.screen { position: fixed; inset: 0; z-index: 25; display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; }
.screen > * { pointer-events: auto; }
.brand { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 18px); text-align: center; pointer-events: none; padding: 0 16px; }
.brand h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 8vw, 58px); margin: 0; line-height: .95; letter-spacing: .01em; color: var(--danfo); text-shadow: 0 3px 0 #1a1400, 0 0 30px rgba(0, 0, 0, .4); }
.brand h1 span { display: block; font-size: .42em; color: var(--text); letter-spacing: .3em; margin-top: 6px; text-shadow: 0 2px 0 #000; }
.brand p { margin: 10px auto 0; color: var(--text); font-size: 14px; max-width: 38ch; text-shadow: 0 1px 4px #000; }
.creator { background: var(--panel); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); width: min(560px, 100%); margin: 0 auto; max-height: 62%; overflow: auto; touch-action: pan-y; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .25); }
.sw[aria-pressed="true"] { border-color: var(--text); outline: 2px solid var(--danfo); outline-offset: 1px; }
.styles { display: flex; gap: 6px; flex-wrap: wrap; }
.styles button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.styles button[aria-pressed="true"] { background: var(--danfo); color: var(--danfo-ink); border-color: var(--danfo); font-weight: 700; }
.c-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin: 12px 0 14px; }
@media (max-width: 520px) { .c-grid { grid-template-columns: 1fr; } }
.c-grid .field label { margin-bottom: 2px; }
@media (min-width: 900px) {
  .screen { flex-direction: row; justify-content: flex-end; }
  .creator { width: 440px; max-height: none; margin: 0; border-radius: 22px 0 0 22px; border-top: 0; border-left: 1px solid var(--line); padding-top: calc(env(safe-area-inset-top, 0px) + 24px); }
  .brand { right: 440px; }
  .c-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 899px) { .creator { max-height: 56%; } }
@media (max-height: 720px) and (max-width: 899px) { .brand p { display: none; } }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 8px 0; font-size: 13px; }
.loading { position: fixed; inset: 0; z-index: 40; background: var(--ink); display: grid; place-items: center; text-align: center; padding: 16px; }
.loading h1 { font-family: var(--display); font-weight: 400; color: var(--danfo); font-size: clamp(30px, 9vw, 54px); margin: 0; line-height: .95; }
.loading p { color: var(--muted); margin-top: 14px; }
.loading .bar { width: 180px; margin: 16px auto 0; }
.photo-hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); background: rgba(15, 18, 24, .7); padding: 6px 12px; border-radius: 999px; font-size: 12px; z-index: 12; }
@media (max-width: 640px) { .ticker { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<canvas id="scene" aria-label="Port Veyra, a 3D city"></canvas>

<div id="loading" class="loading">
  <div>
    <h1>VIBE<br>The Republic</h1>
    <p id="loadMsg">Building Port Veyra…</p>
    <div class="bar"><i id="loadBar" style="width:10%"></i></div>
  </div>
</div>

<div id="hud" class="hud" hidden>
  <div class="hud-top">
    <div class="chip" id="walletChip" role="button" tabindex="0" aria-label="Open Veyra Bank">
      <div class="money" id="hudMoney">₣0</div>
      <div class="meter"><span>Food</span><div class="bar" id="hungerBar"><i style="width:80%"></i></div></div>
    </div>
    <div class="chip clock">
      <b id="hudClock">12:00</b>
      <span><i class="dot" id="netDot"></i><span id="hudOnline">1 online</span></span>
    </div>
  </div>
  <div class="tracker" id="tracker" hidden>
    <div class="t-job" id="tJob">Shift</div>
    <div class="t-goal" id="tGoal">Next stop</div>
    <div class="t-meta" id="tMeta"></div>
    <div class="t-time" id="tTime">15:00</div>
    <button type="button" id="tQuit">Quit shift</button>
  </div>
  <div class="ticker" id="ticker"><b>VEYRA DAILY</b><span id="tickerText">Welcome to Port Veyra.</span></div>
  <div class="joy" id="joy" hidden><i id="joyKnob"></i></div>

const Api = {
  mode: 'offline', sb: null,
  async init() {

      if (!window.supabase || !window.supabase.createClient) throw new Error('no client');
      this.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
      const r = await withTimeout(this.sb.rpc('vibe_feed', { p_after_news: 0, p_after_chat: 0 }), 7000);
      if (r.error) throw r.error;
      this.mode = 'online';
    } catch (e) {
      this.mode = 'offline'; this.sb = null; Offline.init();

    return this.mode;
  },
  async call(fn, args) {
    if (this.mode === 'offline') return Offline.call(fn, args);

    catch (e) { throw new GameError('NETWORK', 'Could not reach Veyra. Check your connection and try again.'); }

      const mesh = kind === 'danfo' ? meshOf(danfoParts()) : kind === 'keke' ? meshOf(kekeParts(i % 2 ? '#22a06b' : '#f5c518')) : meshOf(carParts(colors[i % colors.length]));

  next(node, prev) {

    return opts[Math.floor(Math.random() * opts.length)];
  },
  update(dt) {
    this.cars.forEach(c => {
      const fx = ROADS[c.from[0]], fz = ROADS[c.from[1]], tx = ROADS[c.to[0]], tz = ROADS[c.to[1]];

const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();

  for (const c of colliders) {
    if (x + r < c.x0 || x - r > c.x1 || z + r < c.z0 || z - r > c.z1) continue;
    const nx = clamp(x, c.x0, c.x1), nz = clamp(z, c.z0, c.z1); let dx = x - nx, dz = z - nz; const d = Math.hypot(dx, dz);

}
function updatePlayer(dt) {

  const sp = RIDES[Game.ride].speed * (Game.hunger() < 10 && Game.ride === 'foot' ? 0.7 : 1);
  if (mag > 0.05) {
    const ang = Math.atan2(-ax.x, -ax.y) + Input.camYaw + Math.PI;
    const vx = Math.sin(ang) * sp * mag, vz = Math.cos(ang) * sp * mag;
    const r = ['foot', 'bicycle', 'okada'].includes(Game.ride) ? .6 : 1.6;
    [me.x, me.z] = collide(me.x + vx * dt, me.z + vz * dt, r);
    let d = ang - me.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); me.yaw += d * Math.min(1, dt * (Game.ride === 'foot' ? 12 : 6));
    me.speed = sp * mag;

  // camera
  const ah = me.av.height || 3.1, dist = (Game.ride === 'foot' ? (ah < 2 ? 5.6 : 13) : Game.ride === 'danfo' ? 19 : ['okada', 'bicycle'].includes(Game.ride) && ah < 2 ? 8 : 16) * Input.zoom;

}

/* ═══════════════════════════ SHIFTS ═══════════════════════════ */
const Shifts = {
  async start(job) {
    const s = await Game.act('vibe_start_shift', { p_job: job });
    Sheet.close();
    const sh = s.shift;
    if (job === 'driver' || job === 'police') { toast(job === 'driver' ? 'Your danfo is ready. Follow the yellow beacon.' : 'Patrol car ready. First call is on the beacon.', 'ok'); }
    else if (job === 'clerk') this.clerk(sh);
    else this.journalist(sh);
  },
  // called every frame from the loop: arrival at a driver/police stop
  async check() {
    const sh = Game.state && Game.state.shift; const me = Game.me;
    if (!sh || !(sh.job === 'driver' || sh.job === 'police') || Game.cpBusy || Game.finishing || Date.now() < (Game.backoff || 0)) return;
    const t = shiftTarget();
    if (!t) { Game.finishing = true; const pre = Game.state.me; try { const r = await Game.act('vibe_finish_shift', { p_shift: sh.id, p_answers: [] }); this.payslip(sh.job, r, pre); } catch (e) { showErr(e); Game.backoff = Date.now() + 5000; } finally { Game.finishing = false; } return; }
    Game.target = { x: t.x, z: t.z, name: t.name };
    if (Math.hypot(t.x - me.x, t.z - me.z) > 10) return;
    Game.cpBusy = true;
    try {
      await Game.act('vibe_checkpoint', { p_shift: sh.id, p_index: sh.progress });
      toast(sh.job === 'driver' ? 'Passengers off at ' + t.name + '.' : 'Call at ' + t.name + ' handled.', 'ok');
    } catch (e) { if (e.code !== 'TOO_FAST') showErr(e); Game.backoff = Date.now() + (e.code === 'TOO_FAST' ? 1500 : 5000); }
    finally { Game.cpBusy = false; }
  },
  payslip(job, r, pre) {
    const s = Game.state, notes = [], was = pre || s.me;
    if (was.hunger < 25) notes.push('You worked hungry: 40% less pay.'); if (was.home) notes.push('Home bonus: +10%.');
    const lv = level((was.xp || {})[job]); if (lv) notes.push('Level ' + lv + ': +' + lv * 5 + '%.');
    if (level((s.me.xp || {})[job]) > lv) notes.push('Promoted to level ' + level((s.me.xp || {})[job]) + '.');
    Sheet.open(head('Payslip', JOBS[job].title + ' shift', r.correct || r.wrong ? `${r.correct} right, ${r.wrong} wrong.` : 'Shift complete.') +
      `<dl class="kv"><dt>Gross pay</dt><dd>${fmt(r.gross)}</dd><dt>Income tax (${Math.round(s.city.income_tax * 100)}%)</dt><dd>−${fmt(r.tax)}</dd><dt class="total">Paid to Veyra Bank</dt><dd class="total">${fmt(r.net)}</dd></dl>
       ${notes.length ? `<p class="note" style="margin-top:10px">${esc(notes.join(' '))}</p>` : ''}<div class="stack" style="margin-top:14px"><button class="btn wide" data-close>Done</button></div>`);
    toast('+' + fmt(r.net) + ' paid', 'money');
  },
  waitFor(sh, sec, el, label) {
    return new Promise(res => {
      const t = () => { const left = sec - (Game.serverNow() - Date.parse(sh.started_at)) / 1000; if (left <= 0) return res(); if (el) el.textContent = label + ' ' + Math.ceil(left) + ' s'; setTimeout(t, 250); };
      t();
    });
  },
  clerk(sh) {
    const ans = []; let i = 0;
    const draw = () => {
      if (i >= sh.cards.length) return this.clerkSubmit(sh, ans);
      const c = sh.cards[i];
      Sheet.locked = true;
      Sheet.open(head('Permit desk · ' + (i + 1) + ' of ' + sh.cards.length, 'Approve or reject?') +
        `<div class="rules"><b>Approve only if</b> the fee is paid, tax is cleared, and the business is allowed in that zone. Salons: Residential or Market. Nightclubs: Market or Industrial. Workshops: Industrial only. Bukas and pharmacies: any zone.</div>
         <div class="permit" style="margin-top:12px"><div class="ph"><span>Port Veyra permit application</span><span>No. ${String(1000 + i * 37).padStart(5, '0')}</span></div><h3>${esc(c.business)}</h3>
         <dl><dt>Applicant</dt><dd>${esc(c.applicant)}</dd><dt>Zone</dt><dd>${esc(c.zone)}</dd><dt>Licence fee</dt><dd>${c.fee_paid ? 'Paid' : 'Not paid'}</dd><dt>Tax clearance</dt><dd>${c.tax_cleared ? 'Cleared' : 'Missing'}</dd></dl></div>
         <div class="row-btns" style="margin-top:14px"><button class="btn red wide" id="pRej">Reject</button><button class="btn green wide" id="pApp">Approve</button></div>`,
        () => { $('#pApp').onclick = () => { ans.push(true); i++; draw(); }; $('#pRej').onclick = () => { ans.push(false); i++; draw(); }; $('#sheet .x').onclick = () => { Sheet.locked = false; Sheet.close(); toast('Shift paused. Come back to City Hall to continue.'); }; });
    };
    draw();
  },
  async clerkSubmit(sh, ans) {
    Sheet.open(head('Permit desk', 'Stamping your decisions') + `<p id="stampMsg">Stamping…</p>`);
    await this.waitFor(sh, 13, $('#stampMsg'), 'The supervisor checks your stamps:');
    Sheet.locked = false;
    const pre = Game.state.me;
    try { const r = await Game.act('vibe_finish_shift', { p_shift: sh.id, p_answers: ans }); this.payslip('clerk', r, pre); } catch (e) { Sheet.close(); showErr(e); }
  },
  journalist(sh) {
    const angles = h => [h, 'Port Veyra reacts: ' + h.replace(/\.$/, ''), 'Why everyone is talking about this: ' + h.replace(/\.$/, '')].map(x => x.slice(0, 90));
    let pick = 0;
    const draw = () => {
      Sheet.open(head('Veyra Daily', 'File a story', 'Pick what you are covering, then write the headline readers will see.') +
        `<div class="stack">${sh.events.map((e, k) => `<button class="card" style="text-align:left;border-color:${k === pick ? 'var(--danfo)' : 'var(--line)'}" data-ev="${k}"><div><h3>${esc(e.headline)}</h3></div></button>`).join('')}
        <div class="field"><label for="hl">Your headline (10 to 90 characters)</label><textarea id="hl" maxlength="90">${esc(angles(sh.events[pick].headline)[1])}</textarea></div>
        <p class="note">Publish only what you would stand behind. Stories carry your name.</p>
        <button class="btn wide" id="hlGo">File story</button><p class="note" id="hlMsg"></p></div>`, el => {
        el.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => { pick = +b.dataset.ev; draw(); });
        $('#hlGo').onclick = () => busy($('#hlGo'), async () => {
          const text = $('#hl').value.trim(); if (text.length < 10) { toast('Headlines need at least 10 characters.', 'err'); return; }
          await this.waitFor(sh, 16, $('#hlMsg'), 'The editor is reading it:');
          const pre = Game.state.me;
          const r = await Game.act('vibe_finish_shift', { p_shift: sh.id, p_answers: { event: pick, headline: text } });
          this.payslip('journalist', r, pre); Feed.poll(); Net.announce();
        });
      });
    };
    draw();
  },
  async quit() { try { await Game.act('vibe_quit_shift'); Game.target = null; toast('Shift ended. No pay for unfinished work.'); } catch (e) { showErr(e); } }
};

  }

/* ═══════════════════════════ FEED & MULTIPLAYER ═══════════════════════════ */
const Feed = {
  async poll() {
    try {
      const r = await Api.call('vibe_feed', { p_after_news: Game.feed.lastNews, p_after_chat: Game.feed.lastChat });
      if (r.news.length) { Game.feed.news.push(...r.news); Game.feed.news = Game.feed.news.slice(-60); Game.feed.lastNews = r.news[r.news.length - 1].id; $('#tickerText').textContent = r.news[r.news.length - 1].headline; if (Phone.view === 'news' && !$('#phone').hidden) Phone.refresh(); }
      this.addChat(r.chat);
      $('#netDot').classList.remove('off');
    } catch (e) { $('#netDot').classList.add('off'); }
  },
  addChat(list) {
    const fresh = list.filter(m => !Game.feed.chat.some(c => c.id === m.id)); if (!fresh.length) return;
    Game.feed.chat.push(...fresh); Game.feed.chat.sort((a, b) => a.id - b.id); Game.feed.chat = Game.feed.chat.slice(-80);
    Game.feed.lastChat = Math.max(Game.feed.lastChat, ...fresh.map(m => m.id));
    fresh.forEach(m => { const who = m.player_id === (Game.state && Game.state.me.id) ? Game.me : (Net.peers.get(m.player_id) || {}).actor; if (who && Date.now() - Date.parse(m.at) < 20000) who.bubble(m.text); });
    if (Phone.view === 'chat' && !$('#phone').hidden) Phone.renderChat();
  }
};
const Net = {
  ch: null, peers: new Map(), last: 0, lastSent: '',
  connect() {
    if (Api.mode !== 'online' || !Game.state) return;
    const me = Game.state.me;
    this.ch = Api.sb.channel(CHANNEL, { config: { presence: { key: me.id }, broadcast: { self: false, ack: false } } });
    this.ch
      .on('broadcast', { event: 'pos' }, ({ payload }) => this.onPos(payload))
      .on('broadcast', { event: 'chat' }, ({ payload }) => Feed.addChat([payload]))
      .on('broadcast', { event: 'news' }, () => Feed.poll())
      .on('presence', { event: 'sync' }, () => this.onSync())
      .subscribe(st => { if (st === 'SUBSCRIBED') { this.track(); $('#netDot').classList.remove('off'); } else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') $('#netDot').classList.add('off'); });
  },
  track() { if (this.ch && Game.state) this.ch.track({ id: Game.state.me.id, name: Game.state.me.name, look: Game.state.me.look, ride: Game.ride }).catch(() => { }); },
  onSync() {
    const st = this.ch.presenceState(), seen = new Set(), myId = Game.state.me.id;
    Object.values(st).forEach(arr => { const p = arr[0]; if (!p || !p.id || p.id === myId) return; seen.add(p.id);
      const name = String(p.name || 'Citizen').slice(0, 16);
      let pe = this.peers.get(p.id); if (!pe) { pe = { name, look: p.look || {}, actor: null, tx: null, tz: null, ty: 0, seen: Date.now() }; this.peers.set(p.id, pe); }
      if (pe.name !== name || JSON.stringify(pe.look) !== JSON.stringify(p.look || {})) {
        pe.name = name; pe.look = p.look || {};
        if (pe.actor) { const o = pe.actor; pe.actor = new Actor(pe.look, pe.name, false); pe.actor.x = o.x; pe.actor.z = o.z; pe.actor.yaw = o.yaw; pe.actor.setRide(o.ride); o.dispose(); }
      } });
    this.peers.forEach((pe, id) => { if (!seen.has(id)) { if (pe.actor) pe.actor.dispose(); this.peers.delete(id); } });
    $('#hudOnline').textContent = (this.peers.size + 1) + ' online';
  },
  onPos(d) {
    if (!d || typeof d.id !== 'string' || !isFinite(d.x) || !isFinite(d.z)) return;
    let pe = this.peers.get(d.id); if (!pe) { pe = { name: 'Citizen', look: {}, actor: null, seen: Date.now() }; this.peers.set(d.id, pe); }
    if (!pe.actor) { pe.actor = new Actor(pe.look, pe.name, false); pe.actor.x = d.x; pe.actor.z = d.z; }
    pe.tx = clamp(d.x, -300, 320); pe.tz = clamp(d.z, -300, 320); pe.ty = +d.r || 0; pe.sp = +d.s || 0; pe.seen = Date.now();
    if (RIDES[d.v]) pe.actor.setRide(d.v);
  },
  sendPos() {
    if (!this.ch || !Game.me) return; const t = performance.now(); if (t - this.last < 200) return;
    const me = Game.me, p = { id: Game.state.me.id, x: Math.round(me.x * 10) / 10, z: Math.round(me.z * 10) / 10, r: Math.round(me.yaw * 100) / 100, s: Math.round(me.speed), v: Game.ride };
    const key = p.x + ',' + p.z + ',' + p.r + ',' + p.v; if (key === this.lastSent && t - this.last < 2000) return;
    this.last = t; this.lastSent = key; this.ch.send({ type: 'broadcast', event: 'pos', payload: p }).catch(() => { });
  },
  chat(m) { if (this.ch) this.ch.send({ type: 'broadcast', event: 'chat', payload: m }).catch(() => { }); },
  announce() { if (this.ch) this.ch.send({ type: 'broadcast', event: 'news', payload: {} }).catch(() => { }); },
  update(dt) {
    this.peers.forEach((pe, id) => {
      const a = pe.actor; if (!a || pe.tx === null) return;
      if (Date.now() - pe.seen > 15000) { a.dispose(); pe.actor = null; return; }
      a.x = lerp(a.x, pe.tx, Math.min(1, dt * 8)); a.z = lerp(a.z, pe.tz, Math.min(1, dt * 8));
      let d = pe.ty - a.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); a.yaw += d * Math.min(1, dt * 8);
      a.place(); animateAvatar(a.av, a.ride === 'foot' ? pe.sp : 0, dt);
    });
  }
};

function signOut(expired) {

  if (Net.ch) { Api.sb.removeChannel(Net.ch); Net.ch = null; } Net.peers.forEach(p => p.actor && p.actor.dispose()); Net.peers.clear();
  $('#hud').hidden = true; Phone.close(); if (Sheet.isOpen) Sheet.close();
  if (expired) toast('Please sign in again.', 'err');
  Onboard.show();
}
function enterWorld(state, isNew) {
  Game.me = new Actor(state.me.look, state.me.name, true);
  Game.me.x = 40 + (Math.random() - .5) * 10; Game.me.z = 46; Game.me.yaw = Math.PI; Game.me.place();
  Input.camYaw = 0; camera.position.set(Game.me.x, 8, Game.me.z + 12);
  Game.apply(state); Game.setRide('foot', true);
  $('#hud').hidden = false; Input.block = false;
  Feed.poll(); Net.connect();
  if (isNew) setTimeout(() => {
    Sheet.open(head('Welcome to Port Veyra', 'Hello, ' + state.me.name, 'You have ' + fmt(state.me.balance) + ' and no job yet.') +
      `<div class="stack"><div class="card"><div><h3>1. Get a job</h3><p>You are at Central Bus Park. Walk onto the yellow ring and start a danfo driver shift.</p></div></div>
       <div class="card"><div><h3>2. Eat and find a home</h3><p>Oja Market feeds you. Palm Estate rents rooms. A home adds 10% to your pay.</p></div></div>
       <div class="card"><div><h3>3. Have a say</h3><p>After 3 shifts you can vote for mayor. After 5 you can run.</p></div></div>
       <p class="note">${matchMedia('(pointer:coarse)').matches ? 'Move with the stick, drag the screen to look around.' : 'Move with WASD or the arrow keys, drag to look, E to enter, P for your phone, R to switch rides.'}</p>
       <button class="btn wide" data-close>Let's go</button></div>`);
  }, 600);
}

/* ═══════════════════════════ DAY & NIGHT ═══════════════════════════ */
const tmpC = new THREE.Color();
function updateSky(t) {
  const hr = (Date.now() / 60000) % 24;
  const day = clamp(Math.sin((hr - 6) / 12 * Math.PI) * 1.4, 0, 1);   // 0 at night, 1 at noon
  const dusk = clamp(1 - Math.abs(hr - 18.5) / 1.6, 0, 1) + clamp(1 - Math.abs(hr - 6) / 1.4, 0, 1);
  tmpC.copy(SKY_NIGHT).lerp(SKY_DAY, day).lerp(SKY_DUSK, clamp(dusk, 0, 1) * .6);
  scene.background.copy(tmpC); scene.fog.color.copy(tmpC);
  sun.intensity = .15 + day * .85; hemi.intensity = .35 + day * .45;
  const night = 1 - day; World.night = night;
  World.windowMats.forEach(m => m.emissiveIntensity = night > .45 ? .9 : 0);
  if (World.lampMat) World.lampMat.color.set(night > .45 ? '#ffd27a' : '#555b61');
  if (World.beam) { World.beam.material.opacity = night > .45 ? .22 : 0; World.beam.rotation.y = t * .6; }
  World.markers.forEach((m, i) => { m.material.opacity = .55 + Math.sin(t * 3 + i) * .3; });
  if (World.water) World.water.material.emissiveIntensity = .2 + Math.sin(t * .8) * .06;
}

/* ═══════════════════════════ APP SHELL: install + full screen ═══════════════════════════ */
const AppShell = {
  deferred: null, touch: matchMedia('(pointer: coarse)').matches,
  standalone() { return matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || navigator.standalone === true; },
  isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  canFull() { return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) && !this.standalone(); },
  // Which install path this device has: 'installed' | 'prompt' | 'ios' | 'android' | 'none'
  plan(ua = navigator.userAgent, standalone = this.standalone(), hasPrompt = !!this.deferred) {
    if (standalone) return 'installed';
    if (hasPrompt) return 'prompt';
    if (/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'ios';
    if (/Android/i.test(ua)) return 'android';
    return 'none';
  },
  canInstall() { const p = this.plan(); return p === 'prompt' || p === 'ios' || p === 'android'; },
  async enterFull() {
    const el = document.documentElement;
    try { if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' }); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen(); } catch (e) { }
    this.sync();
  },
  sync() { const b = $('#fsBtn'); if (b) b.hidden = !this.canFull() || this.isFull(); },
  async install() {
    const p = this.plan();
    if (p === 'prompt') {
      const d = this.deferred; this.deferred = null;
      try { d.prompt(); const c = await d.userChoice; if (c && c.outcome === 'accepted') toast('VIBE is installing. Open it from your home screen.', 'ok'); } catch (e) { }
      this.refreshUI(); return;
    }
    const icon = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></svg>';
    const steps = p === 'ios'
      ? `<ol class="steps"><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button ${icon} at the bottom of the screen.</li><li>Scroll down and tap <b>Add to Home Screen</b>, then <b>Add</b>.</li><li>Open <b>VIBE</b> from your home screen. It runs full screen, with no browser bar.</li></ol>`
      : `<ol class="steps"><li>If you opened this link from another app (WhatsApp, X, Claude), tap the <b>⋮</b> menu at the top and choose <b>Open in Chrome</b>.</li><li>In Chrome, tap <b>⋮</b> then <b>Install app</b> (or <b>Add to Home screen</b>).</li><li>Open <b>VIBE</b> from your home screen. It runs full screen, with no browser bar.</li></ol>`;
    Sheet.open(head('Install', 'Play VIBE as an app', 'Your progress stays with your citizen, so nothing is lost when you switch.') + steps +
      `<div class="stack" style="margin-top:16px"><button class="btn ghost wide" id="copyLink">Copy game link</button><button class="btn wide" data-close>Got it</button></div>`,
      () => { $('#copyLink').onclick = async () => { try { await navigator.clipboard.writeText(PLAY_URL); toast('Link copied.', 'ok'); } catch (e) { toast(PLAY_URL); } }; });
  },
  refreshUI() {
    this.sync();
    if (!$('#onboard').hidden && $('#creator').querySelector('#obGo')) { const pill = $('#installPill'); if (pill) pill.hidden = !this.canInstall(); }
    if (!$('#phone').hidden && Phone.view === 'me') Phone.refresh(true);
  },
  init() {
    addEventListener('beforeinstallprompt', e => { e.preventDefault(); this.deferred = e; this.refreshUI(); });
    addEventListener('appinstalled', () => { this.deferred = null; this.refreshUI(); });
    ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { this.sync(); setTimeout(resize, 60); }));
    // Phones and tablets go full screen on the first tap, which hides the browser bar where the browser allows it.
    const first = () => { if (this.touch && this.canFull() && !this.isFull() && store.get('vibe-fs') !== 'off') this.enterFull(); };
    document.addEventListener('pointerdown', first, { once: true, capture: true });
    $('#fsBtn').onclick = () => { store.del('vibe-fs'); this.enterFull(); };
    this.sync();
    // The installable build ships a manifest and service worker; previews don't.
    if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register('sw.js').catch(() => { });
  }
};
AppShell.init();

/* ═══════════════════════════ BOOT & LOOP ═══════════════════════════ */
const clock = new THREE.Clock(); let hudT = 0, feedT = 0, meT = 0, mapT = 0;
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  updatePlayer(dt); Traffic.update(dt); Net.update(dt); Guide.update(t); updateSky(t);
  if (Onboard.preview) {
    const pv = Onboard.preview; pv.yaw += dt * .6; pv.place(); animateAvatar(pv.av, 0, dt);
    // frame the character in the space the creator panel and title leave free
    const W = innerWidth, H = innerHeight, cr = $('#creator').getBoundingClientRect(), br = $('.brand').getBoundingClientRect();
    const side = cr.width < W * 0.7, top = br.bottom + 8, bottom = side ? H : cr.top, right = side ? cr.left : W;
    const fh = Math.max(140, bottom - top), cx = right / 2, cyy = top + fh / 2;
    const ph = pv.av.height || 3.1, d = (ph * 1.06 / 0.82) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * (H / fh);
    camera.position.set(pv.x + 0.3, ph * 0.48, pv.z + d * Onboard.side); camera.lookAt(pv.x, ph * 0.48, pv.z);
    camera.setViewOffset(W, H, W / 2 - cx, H / 2 - cyy, W, H);
  } else if (camera.view && camera.view.enabled) camera.clearViewOffset();
  else if (!Game.me) { const a = t * .05; camera.position.set(Math.sin(a) * 150, 70, Math.cos(a) * 150); camera.lookAt(0, 0, 0); }
  if (Game.state) {
    if ((hudT += dt) > .25) { hudT = 0; HUD.tick(); Shifts.check(); if (!Game.target || shiftTarget()) { const st = shiftTarget(); if (st) Game.target = { x: st.x, z: st.z, name: st.name }; } if (Game.target && !shiftTarget() && Game.me && Math.hypot(Game.target.x - Game.me.x, Game.target.z - Game.me.z) < 8) Game.target = null; }
    if ((feedT += dt) > 8) { feedT = 0; Feed.poll(); }
    if ((meT += dt) > 45) { meT = 0; Game.act('vibe_me').catch(e => { if (e.code === 'AUTH') showErr(e); }); }
    if (Phone.view === 'map' && !$('#phone').hidden && (mapT += dt) > .3) { mapT = 0; Phone.drawMap(); }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
async function boot() {
  const bar = $('#loadBar'), msg = $('#loadMsg');
  try {
    if (!window.THREE || !THREE.BufferGeometryUtils) throw new Error('The 3D engine failed to load. Check your connection and reload.');
    bar.style.width = '30%';
    try { await withTimeout(Promise.all([document.fonts.load("400 48px 'Bowlby One SC'"), document.fonts.load("700 34px 'Atkinson Hyperlegible'")]), 2500); } catch (e) { }
    buildCity(); bar.style.width = '50%'; await sleep(20);
    // realistic people stream in the background; the city is playable with simple ones until they arrive
    Chars.load().then(upgradePeople).catch(e => console.warn('Realistic characters unavailable, using simple ones:', e && e.message));
    bar.style.width = '65%';
    Traffic.init(); Guide.init(); Input.init(); bar.style.width = '75%';
    msg.textContent = 'Connecting to the Port Veyra server…';
    const mode = await Api.init(); bar.style.width = '95%';
    if (mode === 'offline') {
      $('#hudOnline').textContent = 'Offline'; $('#netDot').classList.add('off');
    }
    requestAnimationFrame(loop);
    const tok = store.get(tokenKey());
    if (tok) {
      try { const s = await Api.call('vibe_me', { p_token: tok }); Game.token = tok; enterWorld(s, false); }
      catch (e) { if (e.code === 'AUTH') store.del(tokenKey()); Onboard.show(); if (e.code !== 'AUTH') showErr(e); }
    } else Onboard.show();
    $('#loading').hidden = true;
  } catch (e) {
    console.error(e); msg.textContent = e.message || 'Port Veyra failed to load. Reload to try again.';
  }
}
boot();
</script>
