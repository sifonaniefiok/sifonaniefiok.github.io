  .speeds button{width:27px;font-size:11px}
  #simcard{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
  #workBtn{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
  .queue{max-width:180px;top:calc(96px + env(safe-area-inset-top,0px))}
  .top{gap:5px;padding-left:8px;padding-right:8px}
  .place{max-width:58vw}.place small{display:none}
  #toasts{top:calc(96px + env(safe-area-inset-top,0px));width:calc(100vw - 20px)}
  #busy{top:calc(96px + env(safe-area-inset-top,0px))}
  #simcard{padding:6px 10px 6px 6px}#portrait{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <canvas id="world" aria-label="Game world"></canvas>
  <header class="top">
    <button class="pill money num" id="moneyBtn" title="Bank (open phone)">₦0</button>
    <div class="pill clock"><b id="dateLbl">Mon</b><span id="timeLbl" class="num">7:00 am</span></div>
    <div class="speeds" role="group" aria-label="Game speed">
      <button data-speed="0" title="Pause (Space)" aria-label="Pause">❚❚</button>
      <button data-speed="1" title="Normal (1)" aria-label="Normal speed">1×</button>
      <button data-speed="2" title="Fast (2)" aria-label="Fast">2×</button>
      <button data-speed="3" title="Ultra (3)" aria-label="Ultra fast">3×</button>
    </div>
    <div class="spacer"></div>
    <div class="pill place" id="placeLbl">Home</div>
    <div class="pill power" id="powerLbl" title="Electricity">💡</div>
    <button class="pill" id="chatBtn" title="Live chat">Chat</button>
  </header>
  <div class="queue" id="queue"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="busy" hidden></div>
  <button id="simcard" title="Needs and skills (S)">
    <canvas id="portrait" width="96" height="96"></canvas>
    <div><div class="nm" id="simName">Sim</div><div class="md" id="simMood">Happy</div><div class="minis" id="minis"></div></div>
  </button>
  <button id="workBtn" hidden>Go to work</button>
  <div id="buybar" hidden></div>
  <nav class="dock" aria-label="Main">
    <button data-nav="home" title="Home (H)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg><b>Home</b><kbd>H</kbd></button>
    <button data-nav="buy" title="Buy mode (B)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 10h16v2H4zm2 3h3v7H6zm9 0h3v7h-3zM5 5h14l1 4H4z"/></svg><b>Buy</b><kbd>B</kbd></button>
    <button data-nav="map" title="Map (M)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m9 4-6 2v14l6-2 6 2 6-2V4l-6 2zm0 2.2 6 2v11.6l-6-2z"/></svg><b>Map</b><kbd>M</kbd></button>
    <button data-nav="phone" title="Phone (P)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 3v13h10V5zm5 14.2a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></svg><b>Phone</b><kbd>P</kbd></button>
    <button data-nav="sim" title="Sim needs and skills (S)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5z"/></svg><b>Sim</b><kbd>S</kbd></button>
    <button data-nav="do" title="Things to do here (T)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 9 9H2l6 4.5L5.5 21 12 16.5 18.5 21 16 13.5 22 9h-7z"/></svg><b>Do</b><kbd>T</kbd></button>
  </nav>
  <div id="chat" hidden>
    <header><b>Lagos Radio</b><span class="muted" id="chatSub" style="font-size:12px"></span><button class="btn ghost" style="margin-left:auto;padding:5px 9px" id="chatClose" aria-label="Close chat">✕</button></header>
    <div id="chatLog"></div>
    <form id="chatForm"><input id="chatInput" maxlength="200" placeholder="Say something to everyone online" autocomplete="off"><button class="btn y" type="submit">Send</button></form>
  </div>
  <div id="menu" hidden></div>
  <div id="sheet" hidden><div class="sheet-card" id="sheetCard"></div></div>
  <div id="modal" hidden><div class="modal-card" id="modalCard"></div></div>
</div>
<script src="data.js"></script>
<script src="sim.js"></script>
<script src="draw.js"></script>
<script src="ui.js"></script>
<script src="net.js"></script>
</body>
</html>
